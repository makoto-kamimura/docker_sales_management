name: docker_ruby

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dr_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-app_development}
      TZ: Asia/Tokyo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app_development}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [appnet]

  api:
    build:
      context: ../app/api
      dockerfile: Dockerfile
    container_name: dr_api
    command: bash -c "bundle exec rails db:prepare && bundle exec rails s -b 0.0.0.0 -p 3000"
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/${POSTGRES_DB:-app_development}
      DIFY_API_BASE: ${DIFY_API_BASE:-http://dify-api:5001/v1}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      RAILS_LOG_TO_STDOUT: "true"
      BUNDLE_PATH: /usr/local/bundle
    volumes:
      - ../app/api:/app
      - bundle_cache:/usr/local/bundle
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks: [appnet]

  web:
    build:
      context: ../app/web
      dockerfile: Dockerfile
    container_name: dr_web
    command: sh -c "npm install && npm run dev -- -p 3001 -H 0.0.0.0"
    environment:
      # ブラウザ (CSR) から見たAPIのURL = ホストの :80 (Nginx)
      NEXT_PUBLIC_API_BASE: http://localhost/api
      # Next.js SSR (Node.js) から見たAPIのURL = Docker network 内のホスト名
      API_BASE_INTERNAL: http://api:3000/api
      NODE_ENV: development
    volumes:
      - ../app/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    ports:
      - "3001:3001"
    networks: [appnet]

  mobile:
    build:
      context: ../app/mobile
      dockerfile: Dockerfile
    container_name: dr_mobile
    # デフォルトは LAN モード。物理デバイスから接続する場合は .env で
    # REACT_NATIVE_PACKAGER_HOSTNAME に開発PCのLAN IPを設定すること。
    # トンネル接続が必要な場合は EXPO_HOST=tunnel を .env に設定 (ngrokを使う)。
    command: sh -c "npm install && npx expo start --host ${EXPO_HOST:-lan} --port 8081"
    environment:
      EXPO_PUBLIC_API_BASE: ${EXPO_PUBLIC_API_BASE:-http://localhost/api}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-host.docker.internal}
      EXPO_NO_TELEMETRY: "1"
    volumes:
      - ../app/mobile:/app
      - mobile_node_modules:/app/node_modules
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    networks: [appnet]

  nginx:
    image: nginx:1.27-alpine
    container_name: dr_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
    depends_on:
      - api
      - web
    networks: [appnet]

  # Dify (AIコンシェルジュプラットフォーム) は公式 compose を別ディレクトリで起動する構成に統一。
  # Rails からは host.docker.internal:8080 経由で Dify nginx を叩く。
  # 詳細: doc/operation.md §3, app/ai/README.md

volumes:
  postgres_data:
  bundle_cache:
  web_node_modules:
  mobile_node_modules:

networks:
  appnet:
    driver: bridge
